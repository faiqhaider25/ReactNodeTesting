name: Deploy to Staging

on:
  # push:
  #   branches: [main] # Triggers when PR is merged to main
  workflow_dispatch: # Allows manual trigger button

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm install

      - name: Run React Tests
        run: npm run test-react

      - name: Run API Tests
        run: npm run test-API

      - name: Build Project
        run: npm run build-react

      # NOTIFICATION ON FAILURE
      - name: Send Email on Failure
        if: failure()
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Deployment Failed - Staging
          to: ${{ secrets.QA_EMAIL }},${{ secrets.QA2_EMAIL }}
          from: GitHub Actions
          body: The build or test failed for the Staging deployment. Check GitHub Actions logs.

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 Staging via SSH
        uses: appleboy/ssh-action@master
        with:
          # Using Staging Secrets
          host: ${{ secrets.EC2_HOST_STAGING }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY_STAGING }}
          script: |
            echo "[STEP 1] Defining variables..."
            # Using a distinct directory name for Staging to keep things organized
            REPO_DIR="ReactNodeStaging" 
            BRANCH="main"

            echo "[STEP 2] Checking if repo directory exists..."
            if [ -d "$REPO_DIR" ]; then
              echo "[INFO] Directory '$REPO_DIR' exists. Switching to repo directory."
              cd "$REPO_DIR"
              echo "[STEP 2.1] Fetching latest..."
              git fetch --all
              echo "[STEP 2.2] Checkout and Pulling main..."
              git checkout main
              git pull origin main
            else
              echo "[INFO] Directory '$REPO_DIR' does not exist. Cloning repository."
              # Directly cloning main branch
              git clone -b main https://github.com/faiqhaider25/ReactNodeTesting.git $REPO_DIR
              cd "$REPO_DIR"
            fi

            echo "[STEP 3] Installing dependencies..."
            npm install

            echo "[STEP 4] Building project..."
            npm run build-react

            echo "[STEP 5] Restarting Staging App..."
            # Using a specific name 'app-staging' to distinguish from testing in PM2 list
            pm2 restart app-staging || pm2 start index.js --name "app-staging"

            echo "[COMPLETE] Staging deployment finished."

      # NOTIFICATION ON SUCCESS
      - name: Send Email on Success
        if: success()
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Deployed to Staging Successfully
          to: ${{ secrets.QA_EMAIL }},${{ secrets.QA2_EMAIL }}
          from: GitHub Actions
          body: |
            Staging Deployment successful!
            The changes from Main are now live.
            Access the app here: http://${{ secrets.EC2_HOST_STAGING }}:3000
