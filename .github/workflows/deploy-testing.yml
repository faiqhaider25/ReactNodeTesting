name: Deploy to Testing

on:
  # pull_request:
  #   branches: [main]
  workflow_dispatch: # Allows manual trigger button

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm install

      - name: Run React Tests
        run: npm run test-react # Runs frontend tests

      - name: Run API Tests
        run: npm run test-API # Runs backend jest tests

      - name: Build Project
        run: npm run build-react

      # NOTIFICATION ON FAILURE
      - name: Send Email on Failure
        if: failure()
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Deployment Failed - Testing
          to: ${{ secrets.QA_EMAIL }},${{ secrets.QA2_EMAIL }}
          from: GitHub Actions
          body: The build or test failed for the PR. Check GitHub Actions logs.

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST_TESTING }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY_TESTING }}
          script: |

            echo "[STEP 1] Defining variables..."
            REPO_DIR="ReactNodeTesting"
            BRANCH="${{ github.head_ref || github.ref_name }}"
            echo "[INFO] Initial branch value: $BRANCH"
            if [ -z "$BRANCH" ]; then
              echo "[WARN] BRANCH variable is empty, defaulting to 'faiq/feature'"
              BRANCH="faiq/feature"
            fi
            echo "[INFO] Using branch: $BRANCH"

            echo "[STEP 2] Checking if repo directory exists..."
            if [ -d "$REPO_DIR" ]; then
              echo "[INFO] Directory '$REPO_DIR' exists. Switching to repo directory."
              cd "$REPO_DIR"
              echo "[STEP 2.1] Fetching all branches..."
              git fetch --all
              echo "[STEP 2.2] Checking out branch: $BRANCH"
              git checkout $BRANCH
              echo "[STEP 2.3] Pulling latest changes for branch: $BRANCH"
              git pull origin $BRANCH
            else
              echo "[INFO] Directory '$REPO_DIR' does not exist. Cloning repository."
              echo "[STEP 2.4] Cloning branch: $BRANCH from remote."
              git clone -b $BRANCH https://github.com/faiqhaider25/ReactNodeTesting.git $REPO_DIR
              cd "$REPO_DIR"
            fi

            echo "[STEP 3] Installing dependencies with npm..."
            npm install
            echo "[STEP 4] Building project with npm run build-react..."
            npm run build-react

            echo "[STEP 5] Restarting or starting app with PM2..."
            pm2 restart app || pm2 start index.js --name "app"
            echo "[COMPLETE] Deployment script finished."

      # NOTIFICATION ON SUCCESS
      - name: Send Email on Success
        if: success()
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Deployed to Testing Successfully
          to: ${{ secrets.QA_EMAIL }},${{ secrets.QA2_EMAIL }}
          from: GitHub Actions
          body: |
            Deployment successful!
            Access the app here: http://${{ secrets.EC2_HOST_TESTING }}:3000
