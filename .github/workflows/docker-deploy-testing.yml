name: Deploy Docker to Testing

on:
  pull_request:
    branches: [main]
  workflow_dispatch: # Allows manual trigger

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: 715841332204.dkr.ecr.us-east-2.amazonaws.com/devops-assignment/reactnodetesting
  CONTAINER_NAME: react-node-app
  IMAGE_TAG: latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # We use the official action to configure AWS credentials for the runner environment
      # This effectively performs 'aws configure' safely using secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ECR_ACCESS_ID }}
          aws-secret-access-key: ${{ secrets.ECR_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        run: |
          echo "[STEP 1] Logging into ECR..."
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin 715841332204.dkr.ecr.us-east-2.amazonaws.com

      - name: Build, Tag, and Push Docker Image
        run: |
          echo "[STEP 2] Building Docker image..."
          docker build -t react-node-app .

          echo "[STEP 3] Tagging image as: $ECR_REPOSITORY:$IMAGE_TAG"
          docker tag react-node-app:latest $ECR_REPOSITORY:$IMAGE_TAG

          echo "[STEP 4] Pushing image to ECR..."
          docker push $ECR_REPOSITORY:$IMAGE_TAG

          echo "[SUCCESS] Image successfully pushed to ECR."

      # NOTIFICATION ON FAILURE (BUILD/PUSH)
      - name: Send Email on Failure
        if: failure()
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Docker Build Failed - Testing
          to: ${{ secrets.QA_EMAIL }},${{ secrets.QA2_EMAIL }}
          from: GitHub Actions
          body: The Docker build or push to ECR failed. Check GitHub Actions logs.

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST_TESTING }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY_TESTING }}
          script: |
            echo "[STEP 1] Initializing Deployment on EC2..."

            # Login to ECR inside EC2 (using instance role or configured CLI)
            echo "[STEP 2] Logging into ECR..."
            echo "User: $(whoami)"
            echo "Command: aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 715841332204.dkr.ecr.us-east-2.amazonaws.com"
            login_output=$(aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 715841332204.dkr.ecr.us-east-2.amazonaws.com 2>&1)
            echo "Output: $login_output"
            if [ $? -eq 0 ]; then
              echo "Login: Success"
            else
              echo "Login: Failed"
            fi

            echo "[STEP 3] Pulling latest image..."
            echo "User: $(whoami)"
            echo "Command: docker pull 715841332204.dkr.ecr.us-east-2.amazonaws.com/devops-assignment/reactnodetesting:latest"
            pull_output=$(docker pull 715841332204.dkr.ecr.us-east-2.amazonaws.com/devops-assignment/reactnodetesting:latest 2>&1)
            echo "Output: $pull_output"
            if [ $? -eq 0 ]; then
              echo "Pull: Success"
            else
              echo "Pull: Failed"
            fi

            # CRITICAL: Clean up old container to free up the port and name
            echo "[STEP 4] Cleaning up old container..."
            if [ "$(docker ps -a -q -f name=react-node-app)" ]; then
                echo "Found existing container. Stopping and removing..."
                echo "User: $(whoami)"
                echo "Command: docker stop react-node-app"
                stop_output=$(docker stop react-node-app 2>&1)
                echo "Output: $stop_output"
                if [ $? -eq 0 ]; then
                  echo "Stop: Success"
                else
                  echo "Stop: Failed"
                fi
                echo "User: $(whoami)"
                echo "Command: docker rm react-node-app"
                rm_output=$(docker rm react-node-app 2>&1)
                echo "Output: $rm_output"
                if [ $? -eq 0 ]; then
                  echo "Remove: Success"
                else
                  echo "Remove: Failed"
                fi
            else
                echo "No existing container found. Proceeding."
            fi

            echo "[STEP 5] Running new container..."
            # Running detached (-d), mapping host 3001 to container 3000 (-p), with specific name
            echo "User: $(whoami)"
            echo "Command: docker run -d -p 3001:3000 --name react-node-app 715841332204.dkr.ecr.us-east-2.amazonaws.com/devops-assignment/reactnodetesting:latest"
            run_output=$(docker run -d -p 3001:3000 --name react-node-app 715841332204.dkr.ecr.us-east-2.amazonaws.com/devops-assignment/reactnodetesting:latest 2>&1)
            echo "Output: $run_output"
            if [ $? -eq 0 ]; then
              echo "Run: Success"
            else
              echo "Run: Failed"
            fi

            echo "[STEP 6] Cleaning up credentials..."
            echo "User: $(whoami)"
            echo "Command: docker logout 715841332204.dkr.ecr.us-east-2.amazonaws.com"
            logout_output=$(docker logout 715841332204.dkr.ecr.us-east-2.amazonaws.com 2>&1)
            echo "Output: $logout_output"
            if [ $? -eq 0 ]; then
              echo "Logout: Success"
            else
              echo "Logout: Failed"
            fi

            echo "[COMPLETE] Deployment successful. App is running."

      # NOTIFICATION ON SUCCESS
      - name: Send Email on Success
        if: success()
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Deployed Docker App to Testing
          to: ${{ secrets.QA_EMAIL }},${{ secrets.QA2_EMAIL }}
          from: GitHub Actions
          body: |
            Docker Deployment successful!
            The container 'react-node-app' is updated.
            Access the app here: http://${{ secrets.EC2_HOST_TESTING }}:3001

      # NOTIFICATION ON FAILURE (DEPLOY)
      - name: Send Email on Deployment Failure
        if: failure()
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Deployment to EC2 Failed
          to: ${{ secrets.QA_EMAIL }},${{ secrets.QA2_EMAIL }}
          from: GitHub Actions
          body: The SSH deployment step failed. Check GitHub Actions logs.
